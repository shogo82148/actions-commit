name: test
on:
  push:
    branches-ignore:
      - "actions-commit/*"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/
        with:
          github-token: "this token should be not used because there is no changes"
      - name: make some changes
        run: ./testdata/update.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  test-file-modes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-file-modes"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: make some changes
        run: |
          ./testdata/update.sh
          ./testdata/update-file-modes.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  # the action should work without credentials persisted by actions/checkout,
  # because it fetches the commit with the github-token input.
  test-without-persisted-credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-without-persisted-credentials"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: make some changes
        run: ./testdata/update.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
