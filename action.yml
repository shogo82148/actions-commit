name: "Commit Action"
description: "Create a signed commit on GitHub using the GraphQL API"
inputs:
  github-token:
    description: "The GitHub Token"
    required: true
    default: "${{ github.token }}"
  base-branch:
    description: "The base branch"
    required: true
    default: "${{ github.ref_name }}"
  head-branch:
    description: "The head branch. The default is same as base-branch."
    required: false
  commit-message:
    description: 'The commit message. The default is "Auto updates by the $GITHUB_WORKFLOW workflow".'
    required: false
  working-directory:
    description: "The working directory"
    required: false
    default: "."
outputs:
  commit-url:
    description: "The URL of a commit created"
  commit-sha:
    description: "The SHA of a commit created"
runs:
  using: "node24"
  main: "dist/index.js"
